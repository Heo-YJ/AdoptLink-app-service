services:
  postgres:
    image: postgres:18
    container_name: adoptlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adoptlink
      POSTGRES_USER: adoptlink
      POSTGRES_PASSWORD: adoptlink
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - adoptlink-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adoptlink -d adoptlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: adoptlink-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - adoptlink-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  adoptlink-postgres-data:
  adoptlink-redis-data: